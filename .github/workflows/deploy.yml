name: Deploy Static Site to CloudBase

on:
  push:
    branches:
      - main # 如果你的默认分支是 master，请改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare release files
        run: |
          mkdir -p release
          # 把网页需要用到的核心文件复制到 release 文件夹中
          cp index.html style.css script.js questions.json wechat.png wechat_pay.png release/ 2>/dev/null || true

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase CLI
        run: tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy to CloudBase Static Hosting
        run: tcb hosting deploy ./release / -e ${{ secrets.TCB_ENV_ID }}
